name: Quality

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Go quality
    runs-on: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.4"
          cache: false

      - name: Scan Go dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -scan=module

      - name: Install golangci-lint
        run: |
          set -eu
          mkdir -p "$PWD/.bin"
          GOBIN="$PWD/.bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          "$PWD/.bin/golangci-lint" version

      - name: Run quality checks
        run: |
          set -eu
          PATH="$PWD/.bin:$PATH" make quality
